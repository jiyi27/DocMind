[project]
name = "docmind"
version = "0.1.0"
description = "RAG Knowledge Base powered by LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.135.1",
    "langchain>=1.2.11",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.1.11",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.1",
    "langgraph>=1.1.0",
    "ollama>=0.6.1",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt>=2.12.0",
    "pymupdf4llm>=0.0.17",
    "pypdf>=6.8.0",
    "pytest>=9.0.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.22",
    "qdrant-client>=1.17.0",
    "ruff>=0.15.6",
    "uvicorn>=0.41.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.6",
]
